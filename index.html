<style>
/* Disposition : barre d'outils, palette de composants à gauche, schéma au-dessus de l'oscilloscope, inspecteur et mesures à droite. */
:root{
  --bg:#e9edf1;--panel:#f6f8fa;--panel2:#ffffff;--line:#cdd5dd;--fg:#14202b;--muted:#5d6b79;
  --accent:#1c58e6;--accent-fg:#ffffff;--sel:#e8541d;--canvas:#fbfcfd;--dots:#c9d1d9;--ink:#1b2b3a;--good:#1e8a52;--bad:#c23a28;
  --t1:#d4412f;--t2:#1f6fd1;--t3:#1e9a5a;--t4:#bf7a0b;--t5:#8a4fd0;--t6:#0f93a6;--t7:#c2417f;--t8:#5c6b7a;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1319;--panel:#141c24;--panel2:#18222c;--line:#27343f;--fg:#dce6ee;--muted:#8a9aa8;
  --accent:#6ea2ff;--accent-fg:#0b1220;--sel:#ff9a5c;--canvas:#10171e;--dots:#25313c;--ink:#cfe0ef;--good:#4fd18b;--bad:#ff7a66;
  --t1:#ff7a66;--t2:#6aa8ff;--t3:#4fd18b;--t4:#f2b84b;--t5:#b58cff;--t6:#4cd0e0;--t7:#ff7fb3;--t8:#9fb0c0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1319;--panel:#141c24;--panel2:#18222c;--line:#27343f;--fg:#dce6ee;--muted:#8a9aa8;
  --accent:#6ea2ff;--accent-fg:#0b1220;--sel:#ff9a5c;--canvas:#10171e;--dots:#25313c;--ink:#cfe0ef;--good:#4fd18b;--bad:#ff7a66;
  --t1:#ff7a66;--t2:#6aa8ff;--t3:#4fd18b;--t4:#f2b84b;--t5:#b58cff;--t6:#4cd0e0;--t7:#ff7fb3;--t8:#9fb0c0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:.02em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border:2px solid var(--accent);border-radius:3px;position:relative}
.brand i::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2px;background:var(--accent);transform:skewY(-22deg)}
.grp{display:flex;align-items:center;gap:6px}
[hidden]{display:none!important}
#preset{max-width:170px}
.lbl{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;padding:5px 16px}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px}
input[type=text],select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
input.num{width:84px;font-family:var(--mono);text-align:right}
.status{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:12px;min-width:0;flex:1 1 90px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.err{color:var(--bad)}.status.ok{color:var(--good)}
.work{display:grid;grid-template-columns:96px minmax(0,1fr) 7px var(--side,300px);min-height:0}
.pal{background:var(--panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer;font-size:11px;color:var(--muted)}
.tool:hover{border-color:var(--line);color:var(--fg)}
.tool.on{border-color:var(--accent);color:var(--fg);background:var(--panel2)}
.tool canvas{width:56px;height:26px}
.sep{height:1px;background:var(--line);margin:3px 0}
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.center.sbs{flex-direction:row}
.sch{position:relative;flex:0 0 var(--a,53%);min-height:90px;min-width:200px;background:var(--canvas)}
.center>.scopes{flex:1 1 0;min-height:90px;min-width:240px;display:flex;flex-direction:column;overflow:auto}
.scopes>.scope{flex:1 1 0;min-height:170px}
.scope.act .sbar{box-shadow:inset 3px 0 0 var(--accent)}
.scope.act .stitle{color:var(--accent);font-weight:600}
.scopes>.gut{flex:0 0 7px}
.gut{flex:0 0 7px;background:var(--panel);border:0 solid var(--line);border-width:1px 0;cursor:row-resize;touch-action:none;position:relative;z-index:2}
.gut::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:3px;margin:-1px 0 0 -17px;border-radius:2px;background:var(--line)}
.center.sbs>.gut,.gv{cursor:col-resize;border-width:0 1px}
.center.sbs>.gut::after,.gv::after{width:3px;height:34px;margin:-17px 0 0 -1px}
.gut:hover,.gut.act,.gut:focus-visible{background:var(--panel2)}
.gut:hover::after,.gut.act::after,.gut:focus-visible::after{background:var(--accent)}
.sch canvas,.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:10px;bottom:8px;color:var(--muted);font-size:11px;background:var(--canvas);padding:1px 6px;border-radius:4px;pointer-events:none;max-width:90%}
.scope{position:relative;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:var(--canvas);overflow:hidden}
.sbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.sbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}
.splot{position:relative;min-height:0}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:5px}
.field label{color:var(--fg)}
.field input[type=text]{width:110px;font-family:var(--mono);text-align:right}
.field select{max-width:150px}
.row{display:flex;flex-wrap:wrap;gap:5px}
.empty{color:var(--muted);font-size:12px}
.mform{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.mform .mr{display:grid;grid-template-columns:34px 1fr;gap:5px;align-items:center;margin-bottom:5px}
.mform .mr label{color:var(--muted);font-size:12px}
.mform select,.mform input[type=text]{width:100%}
.pr input.par{width:58px;font-family:var(--mono);text-align:right;padding:1px 4px;font-size:12px}
.pr{display:flex;align-items:center;gap:7px;padding:3px 0;min-width:0}
.pr .sw{width:10px;height:10px;border-radius:2px;flex:none}
.pr span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.pr button:hover{color:var(--bad)}
.meas{border-top:1px solid var(--line);padding:6px 0}
.meas b{display:flex;align-items:center;gap:6px;font-weight:500}
.meas b i{width:10px;height:3px;border-radius:2px}
.meas dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1px 8px;font-family:var(--mono);font-size:12px}
.meas dt{color:var(--muted)}.meas dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px}
@media (max-width:900px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .work{grid-template-columns:minmax(0,1fr)}
  .pal{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .tool{flex:none;min-width:70px}.sep{width:1px;height:auto;margin:0 3px}
  .center,.center.sbs{flex-direction:column}.sch{flex:0 0 360px}.center>.scopes{flex:0 0 auto;overflow:visible}.scopes>.scope{flex:0 0 340px}.gut{display:none}
  .side{border-left:0;border-top:1px solid var(--line)}
  .status{margin-left:0;flex-basis:100%;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app">
  <header class="top">

        <option value="inv3">Onduleur triphasé MLI sinus</option>

    <div class="grp"><button class="btn" id="save" title="Enregistrer le circuit dans un fichier">Enregistrer</button><button class="btn" id="open" title="Ouvrir un fichier de circuit">Ouvrir…</button><input type="file" id="file" accept=".json,application/json" hidden></div>
    <div class="grp"><button class="btn" id="layout" title="Placer le schéma et les oscilloscopes côte à côte ou l’un sous l’autre">Côte à côte</button><button class="btn" id="addscope" title="Ajouter une fenêtre d’oscilloscope">+ Oscillo</button><label class="lbl" style="display:flex;align-items:center;gap:4px" title="Synchroniser la plage de temps de tous les oscilloscopes"><input type="checkbox" id="linkx" checked>Axes liés</label></div>
    <div class="grp"><button class="btn" id="undo" title="Annuler (Ctrl+Z)">Annuler</button><button class="btn" id="clear">Nouveau</button></div>
    <div class="grp"><span class="lbl">Durée</span><input class="num" id="tstop" type="text" value="5m" aria-label="Durée de simulation en secondes"><span class="lbl">s</span>
      <span class="lbl">Pas</span><input class="num" id="dtin" type="text" value="auto" aria-label="Pas de calcul en secondes"><span class="lbl">s</span></div>

  </header>
  <div class="work">
    <nav class="pal" id="pal" aria-label="Composants"></nav>
    <section class="center">
      <div class="sch" id="schbox"><canvas id="sch" tabindex="0" aria-label="Éditeur de schéma"></canvas><div class="hint" id="hint"></div></div>
      <div class="gut" id="gsplit" role="separator" tabindex="0" aria-label="Redimensionner l’éditeur de circuit et l’oscilloscope"></div>
      <div class="scopes" id="scopes"></div>

      <section><h3>Sondes</h3><div id="probes"></div></section>
      <section><h3>Mesures sur la plage affichée</h3>
        <div class="grp" style="margin-bottom:6px"><span class="lbl">Fondamentale</span><input class="num" id="f1" type="text" value="50" aria-label="Fréquence fondamentale en Hz" style="width:60px"><span class="lbl">Hz</span><button class="btn sm" id="thdbtn">Calculer le THD</button></div>
        <div id="meas"></div></section>
    </aside>
  </div>

<script>
/* ===== Commutation : noyau (netlist, solveur MNA, mesures, exemples) ===== */
const DEFAULTS={
  R:{R:10}, L:{L:1e-3,i0:0}, C:{C:100e-6,v0:0},
  Vdc:{V:48}, Vac:{amp:325,f:50,ph:0,off:0}, Idc:{I:1}, Iac:{amp:1,f:50,ph:0,off:0},
  D:{Vf:0.7,Ron:0.01},
  XF:{Lp:1e-3,n:1,k:0.99,inv:0},
  SCR:{mode:'angle',Vf:1,Ron:0.01,alpha:30,ph:0,fref:50,width:60},
  SIN:{amp:1,f:50,ph:0,off:0}, CST:{value:0.5}, TRI:{f:20000,min:0,max:1}, CMP:{high:1,low:0,hyst:0},
  SUM:{s1:1,s2:-1}, GAIN:{K:1}, PI:{Kp:0.01,Ki:20,min:0,max:1,i0:0}, SV:{K:1}, SI:{K:1,Rs:1e-3},
  SW:{mode:'pwm',fsw:20000,duty:0.5,m:0.8,fref:50,ph:0,inv:0,body:1,Ron:0.01,Vf:0.7}
};
const PREFIX={R:'R',L:'L',C:'C',Vdc:'V',Vac:'E',D:'D',SW:'S',SCR:'T',Idc:'I',Iac:'Ia',XF:'TR',SIN:'Ref',CST:'Cst',TRI:'Tri',CMP:'Cmp',SUM:'Sum',GAIN:'Gn',PI:'PI',SV:'Cv',SI:'Ci',gnd:'GND'};
function nextName(comps,type){const px=PREFIX[type];let n=1;const used=new Set(comps.map(c=>c.name));while(used.has(px+n))n++;return type==='gnd'?'GND':px+n}
function pinDefs(c){const t=c.type,p=Object.assign({},DEFAULTS[t],c.p);
  if(t==='gnd')return[{x:0,y:0,r:'gnd'}];
  switch(t){
    case'SIN':case'CST':case'TRI':return[{x:2,y:0,r:'o'}];
    case'CMP':case'SUM':return[{x:-2,y:-1,r:'i1'},{x:-2,y:1,r:'i2'},{x:2,y:0,r:'o'}];
    case'GAIN':case'PI':return[{x:-2,y:0,r:'i1'},{x:2,y:0,r:'o'}]}
  if(t==='XF')return[{x:-2,y:-1,r:'a'},{x:-2,y:1,r:'b'},{x:2,y:-1,r:'c'},{x:2,y:1,r:'d'}];
  const d=[{x:-2,y:0,r:'a'},{x:2,y:0,r:'b'}];
  if(t==='SW'&&p.mode==='ext')d.push({x:0,y:-2,r:'g'});
  if(t==='SCR'&&p.mode==='ext')d.push({x:1,y:1,r:'g'});
  if(t==='SV'||t==='SI')d.push({x:0,y:-2,r:'o'});
  return d}
function pinsOf(c){const rot=((c.rot%4)+4)%4;
  return pinDefs(c).map(d=>{let x=d.x,y=d.y;for(let i=0;i<rot;i++){const t=x;x=-y;y=t}return[c.x+x,c.y+y]})}
const BLOCK_TYPES=new Set(['SIN','CST','TRI','CMP','SUM','GAIN','PI']);
const K=(x,y)=>x+','+y;
function makeUF(){const p=new Map();
  const f=k=>{if(!p.has(k))p.set(k,k);let r=k;while(p.get(r)!==r)r=p.get(r);let c=k;while(p.get(c)!==r){const n=p.get(c);p.set(c,r);c=n}return r};
  return{f,u:(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb)p.set(ra,rb)}}}
function onInterior(w,x,y){
  if(w.x1===w.x2){if(x!==w.x1)return false;const lo=Math.min(w.y1,w.y2),hi=Math.max(w.y1,w.y2);return y>lo&&y<hi}
  if(w.y1===w.y2){if(y!==w.y1)return false;const lo=Math.min(w.x1,w.x2),hi=Math.max(w.x1,w.x2);return x>lo&&x<hi}
  return false}
/* Connectivité : extrémités de fils et broches se connectent entre elles ; un croisement de deux fils sans extrémité ne connecte pas. */
function buildUF(circuit){
  const uf=makeUF(),pts=[];
  for(const w of circuit.wires){uf.u(K(w.x1,w.y1),K(w.x2,w.y2));pts.push([w.x1,w.y1],[w.x2,w.y2])}
  for(const c of circuit.comps)for(const p of pinsOf(c)){pts.push(p);uf.f(K(p[0],p[1]))}
  for(const [x,y] of pts)for(const w of circuit.wires)if(onInterior(w,x,y))uf.u(K(x,y),K(w.x1,w.y1));
  return uf}
function compile(circuit){
  const uf=buildUF(circuit);
  const gnds=circuit.comps.filter(c=>c.type==='gnd');
  if(!gnds.length)return{error:'Ajoutez une masse (GND) au circuit.'};
  for(let i=1;i<gnds.length;i++)uf.u(K(gnds[0].x,gnds[0].y),K(gnds[i].x,gnds[i].y));
  const isPow=r=>r==='a'||r==='b'||r==='c'||r==='d'||r==='gnd',P=new Map(),powRoots=new Map(),sigRoots=new Map();
  for(const c of circuit.comps){const defs=pinDefs(c),ps=pinsOf(c);
    const pins=defs.map((d,i)=>({r:d.r,root:uf.f(K(ps[i][0],ps[i][1]))}));P.set(c.id,pins);
    for(const q of pins)(isPow(q.r)?powRoots:sigRoots).set(q.root,c.name)}
  for(const [root,name] of sigRoots)if(powRoots.has(root))return{error:'Un signal de commande ('+name+') est relié à un nœud de puissance ('+powRoots.get(root)+').'};
  const ids=new Map();ids.set(uf.f(K(gnds[0].x,gnds[0].y)),0);
  const nodeOf=root=>{if(!ids.has(root))ids.set(root,ids.size);return ids.get(root)};
  const sids=new Map(),sigOf=root=>{if(!sids.has(root))sids.set(root,sids.size);return sids.get(root)};
  const elems=[],blocks=[];let nv=0;
  for(const c of circuit.comps){
    if(c.type==='gnd')continue;
    const e={id:c.id,name:c.name,type:c.type,p:Object.assign({},DEFAULTS[c.type],c.p)},by={};
    for(const q of P.get(c.id))by[q.r]=q.root;
    if(BLOCK_TYPES.has(c.type)){
      if(c.type==='TRI'&&!(e.p.f>0))return{error:c.name+' : la fréquence doit être positive.'};
      e.in=[];if(by.i1!==undefined)e.in.push(sigOf(by.i1));if(by.i2!==undefined)e.in.push(sigOf(by.i2));e.out=sigOf(by.o);blocks.push(e);continue}
    e.a=nodeOf(by.a);e.b=nodeOf(by.b);
    if(by.c!==undefined){e.c=nodeOf(by.c);e.d=nodeOf(by.d)}
    if(by.g!==undefined)e.gnet=sigOf(by.g);if(by.o!==undefined)e.out=sigOf(by.o);
    if((c.type==='Vdc'||c.type==='Vac')){
      if(e.a===e.b)return{error:'La source '+c.name+' est en court-circuit.'};
      e.k=nv++}
    if(c.type==='R'&&!(e.p.R>0))return{error:c.name+' : la résistance doit être positive.'};
    if(c.type==='XF'&&!(e.p.Lp>0&&e.p.n>0))return{error:c.name+' : l’inductance primaire et le rapport doivent être positifs.'};
    if(c.type==='L'&&!(e.p.L>0))return{error:c.name+' : l’inductance doit être positive.'};
    if(c.type==='C'&&!(e.p.C>0))return{error:c.name+' : la capacité doit être positive.'};
    if(c.type==='SCR'&&e.p.mode!=='ext'&&!(e.p.fref>0))return{error:c.name+' : la fréquence de référence doit être positive.'};
    if(c.type==='SW'&&e.p.mode!=='ext'&&!(e.p.fsw>0))return{error:c.name+' : la fréquence de découpage doit être positive.'};
    elems.push(e)}
  if(!elems.length)return{error:'Le circuit est vide.'};
  const nSig=sids.size,drv=new Array(nSig).fill(null);
  for(const e of blocks.concat(elems.filter(e=>e.out!==undefined))){

/* ---------- Géométrie / dessin du schéma ---------- */
const cv=$('sch'),cx=cv.getContext('2d');

}

    else{const[wx,wy]=toW(px,py),gx=Math.round(wx),gy=Math.round(wy);const nx=drag.ox+gx-drag.sx,ny=drag.oy+gy-drag.sy;if(nx!==drag.c.x||ny!==drag.c.y){drag.c.x=nx;drag.c.y=ny;drag.moved=true}}}

/* ---------- Inspecteur et sondes ---------- */
function el(tag,attrs,...kids){const n=document.createElement(tag);for(const k in(attrs||{})){if(k==='class')n.className=attrs[k];else if(k.startsWith('on'))n[k]=attrs[k];else n.setAttribute(k,attrs[k])}for(const c of kids)n.append(c);return n}
function renderInsp(){const box=$('insp');box.innerHTML='';

/* ---------- Courbes calculées ---------- */
const MOPS={add:{l:'A + B',b:1},sub:{l:'A − B',b:1},mul:{l:'A × B',b:1},div:{l:'A ÷ B',b:1},gain:{l:'k × A',p:'gain k',d:1},rms:{l:'valeur efficace glissante',p:'fenêtre (s)',d:.02},avg:{l:'moyenne glissante',p:'fenêtre (s)',d:.02},abs:{l:'|A|'},der:{l:'dérivée dA/dt'},int:{l:'intégrale ∫A dt'}};

    case'rms':return'RMS('+A+')';case'avg':return'moy('+A+')';case'abs':return'|'+A+'|';case'der':return'd/dt '+A;case'int':return'∫ '+A;default:return o.l}}

function mathCompute(p,A,B,dt){const L=A.length,o=new Float32Array(L);
  switch(p.op){

    case'sub':for(let k=0;k<L;k++)o[k]=A[k]-B[k];break;
    case'mul':for(let k=0;k<L;k++)o[k]=A[k]*B[k];break;
    case'div':for(let k=0;k<L;k++)o[k]=Math.abs(B[k])<1e-12?0:A[k]/B[k];break;
    case'gain':for(let k=0;k<L;k++)o[k]=A[k]*p.par;break;

    case'rms':case'avg':{const n=Math.max(1,Math.min(L,Math.round(p.par/dt))),S=new Float64Array(L+1),sq=p.op==='rms';

function addPower(comp){snap();const get=k=>{let p=probes.find(q=>q.kind===k&&q.comp===comp);if(!p){p={id:pidc++,comp,kind:k,show:false};probes.push(p)}return p};

  const ns=Math.round(n*per),exact=Math.abs(ns-n*per)<1e-3;sv={t0:(ib-ns)*res.dt,t1:ib*res.dt};thdCache=null;specCache=null;drawScope();renderMeas();broadcast(true);
  setStatus(n+' période(s) entière(s) à '+fmtSI(f1)+'Hz, '+ns+' points'+(exact?'.':'. Le pas ne divise pas exactement la période : léger étalement.'),exact?'ok':'')};
$('mt').onclick=()=>setSpec(false);$('ms').onclick=()=>setSpec(true);
['fmax','win','db'].forEach(i=>$(i).onchange=()=>{specCache=null;drawScope();renderMeas();persistSoon()});

/* ---------- Mesures ---------- */
function renderMeas(){if(active!==S)return;const box=$('meas');box.innerHTML='';if(!res){box.append(el('div',{class:'empty'},'Les mesures apparaissent après une simulation.'));return}
  const tr=visTraces();if(!tr.length){box.append(el('div',{class:'empty'},'Aucune courbe affichée.'));return}
  const ia=Math.max(0,Math.floor(sv.t0/res.dt+1e-6)),ib=Math.min(res.N,Math.ceil(sv.t1/res.dt-1e-6)),f1=parseSI($('f1').value)||50;
  box.append(el('div',{class:'note',style:'margin-bottom:4px'},'Plage : '+fmtSI(sv.t0)+'s à '+fmtSI(sv.t1)+'s'));
  for(const m of tr){const s=stats(res.data[m.i],ia,ib);if(!s)continue;const u=m.unit,f=v=>fmtSI(v,4)+(u?' '+u:'');
    const rows=[['moy.',f(s.mean)],['eff.',f(s.rms)],['min',f(s.min)],['max',f(s.max)],['c‑c',f(s.pp)]];
    if(thdCache&&thdCache[m.i]){const t=thdCache[m.i];rows.push(['THD',t.thd===null?'—':(t.thd*100).toFixed(2)+' %']);rows.push(['fond.',f(t.fund)])}
    if(specMode){const spc=ensureSpec(),it=spc&&spc.items.find(x=>x.m.i===m.i);if(it&&it.s){const ac=it.pk.filter(p=>p.f>0),dc=it.pk.find(p=>p.f===0);if(ac[0])rows.push(['raie max',f(ac[0].a)],['à',fmtSI(ac[0].f,4)+'Hz']);if(dc)rows.push(['continu',f(dc.a)]);for(const p of ac.slice(1,5))rows.push([fmtSI(p.f,4)+'Hz',f(p.a)])}}
    const dl=el('dl');for(const[a,b] of rows){dl.append(el('dt',{},a),el('dd',{},b))}
    box.append(el('div',{class:'meas'},el('b',{},el('i',{style:'background:var(--t'+(m.color+1)+')'}),m.label),dl))}}
function computeThd(){if(!res)return;const f1=parseSI($('f1').value);if(!(f1>0)){setStatus('Fréquence fondamentale invalide.','err');return}
  const ia=Math.max(0,Math.floor(sv.t0/res.dt+1e-6)),ib=Math.min(res.N,Math.ceil(sv.t1/res.dt-1e-6));thdCache={};
  for(const m of visTraces()){const t=thd(res.data[m.i],ia,ib,res.dt,f1);thdCache[m.i]=t||{thd:null,fund:NaN}}
  const bad=Object.values(thdCache).some(t=>isNaN(t.fund));setStatus(bad?'La plage affichée doit couvrir au moins une période de la fondamentale.':'THD calculé sur un nombre entier de périodes.',bad?'err':'ok');renderMeas()}



  function applyView(v,final){sv={t0:v.t0,t1:v.t1};clampView();thdCache=null;if(specMode&&!final)return;specCache=null;drawScope();renderMeas()}
  function reset(){sv=res?{t0:0,t1:res.N*res.dt}:{t0:0,t1:1};thdCache=null;specCache=null;drawScope();renderMeas()}
  function invalidate(){thdCache=null;specCache=null}
  function getState(){return{sel:[...sel],spec:specMode,lanes:$('lanes').checked,fmax:$('fmax').value,win:$('win').value,db:$('db').checked}}
  $('lanes').checked=cfg.lanes!==false;$('fmax').value=typeof cfg.fmax==='string'?cfg.fmax:'auto';$('win').value=cfg.win==='hann'?'hann':'none';$('db').checked=!!cfg.db;if(cfg.spec)setSpec(true,true);
  let rf=0,ro=null;if(window.ResizeObserver){ro=new ResizeObserver(()=>{cancelAnimationFrame(rf);rf=requestAnimationFrame(drawScope)});ro.observe($('splot'))}
  root.addEventListener('pointerdown',()=>{if(active!==S)setActive(S)},true);
  $('close').onclick=()=>removeScope(S);
  S={root,sel,broadcast:()=>broadcast(true),draw:drawScope,renderMeas,applyView,reset,invalidate,getState,computeThd,
     title:()=>$('title').textContent,setTitle:t=>{$('title').textContent=t},setCloseVisible:v=>{$('close').hidden=!v},
     destroy:()=>{if(ro)ro.disconnect();cancelAnimationFrame(rf)}};
  return S}
function drawScope(){for(const q of scopes)q.draw()}
function renderMeas(){if(active)active.renderMeas()}
function setActive(S){active=S;for(const q of scopes)q.root.classList.toggle('act',q===S);renderProbes();S.renderMeas()}
function layoutScopes(){const box=$('scopes');box.innerHTML='';
  scopes.forEach((q,i)=>{if(i>0)box.append(scopeGutter());q.root.style.flex='';q.setTitle('Oscilloscope '+(i+1));q.setCloseVisible(scopes.length>1);box.append(q.root)});
  $('addscope').disabled=scopes.length>=6}
function scopeGutter(){const g=el('div',{class:'gut',role:'separator',tabindex:'0','aria-label':'Redimensionner les oscilloscopes'});
  const fix=()=>{for(const q of scopes)q.root.style.flex=q.root.getBoundingClientRect().height+' 1 0'};
  const prev=()=>g.previousElementSibling,next=()=>g.nextElementSibling;
  const shift=(d,ha,hb)=>{const a=prev(),b=next();if(!a||!b)return;const lo=170-ha,hi=hb-170;if(lo>hi)return;d=Math.max(lo,Math.min(hi,d));a.style.flex=(ha+d)+' 1 0';b.style.flex=(hb-d)+' 1 0'};
  let st=null;
  g.addEventListener('pointerdown',e=>{e.preventDefault();g.setPointerCapture(e.pointerId);g.classList.add('act');fix();st={y:e.clientY,ha:prev().getBoundingClientRect().height,hb:next().getBoundingClientRect().height}});
  g.addEventListener('pointermove',e=>{if(st)shift(e.clientY-st.y,st.ha,st.hb)});
  const end=()=>{st=null;g.classList.remove('act')};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{for(const q of scopes)q.root.style.flex=''});
  g.addEventListener('keydown',e=>{const d={ArrowUp:-20,ArrowDown:20}[e.key];if(d){e.preventDefault();fix();shift(d,prev().getBoundingClientRect().height,next().getBoundingClientRect().height)}});
  return g}
function restoreScopes(cfgs){for(const q of scopes)q.destroy();scopes.length=0;
  for(const c of (Array.isArray(cfgs)&&cfgs.length?cfgs:[{}]).slice(0,6))scopes.push(makeScope(c));
  layoutScopes();scopes.forEach(q=>q.reset());setActive(scopes[0])}
function addScope(){if(scopes.length>=6)return;const shown=new Set();for(const q of scopes)q.sel.forEach(id=>shown.add(id));
  let sel=probes.filter(p=>!shown.has(p.id)&&p.show!==false).map(p=>p.id);if(!sel.length)sel=[...active.sel];
  const q=makeScope({sel});scopes.push(q);layoutScopes();q.reset();setActive(q);persist();requestAnimationFrame(drawScope)}
function removeScope(S){if(scopes.length<2)return;const i=scopes.indexOf(S);S.destroy();scopes.splice(i,1);layoutScopes();setActive(scopes[Math.max(0,i-1)]);persist();requestAnimationFrame(drawScope)}
$('addscope').onclick=addScope;
$('thdbtn').onclick=()=>active&&active.computeThd();
$('f1').onchange=()=>{scopes.forEach(q=>q.invalidate());renderMeas();scopes.forEach(q=>q.draw())};
$('linkx').onchange=()=>{if(active&&$('linkx').checked)active.broadcast()};

/* ---------- Fichiers ---------- */
function normalize(){for(const c of circuit.comps)c.p=Object.assign({},DEFAULTS[c.type],c.p||{})}
const visIn0=p=>!scopes.length||scopes[0].sel.has(p.id);
function fileText(){return JSON.stringify({format:'commutation',version:1,circuit,probes:probes.map(p=>p.kind==='m'?{kind:'m',op:p.op,a:probes.findIndex(q=>q.id===p.a),b:probes.findIndex(q=>q.id===p.b),par:p.par,show:visIn0(p)}:{comp:p.comp,kind:p.kind,show:visIn0(p)}),scopes:scopes.map(q=>{const st=q.getState();st.sel=probes.map((p,i)=>q.sel.has(p.id)?i:-1).filter(i=>i>=0);return st}),tstop:$('tstop').value,dt:$('dtin').value},null,1)}
function downloadFile(data,filename){const url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function saveFile(){const data=fileText();
  if(window.claude&&window.claude.use){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:'circuit-commutation.json',data});setStatus('Circuit enregistré.','ok');return}}
    catch(e){if(e&&e.code==='declined'){setStatus('Enregistrement annulé.');return}setStatus('Échec de l’enregistrement : '+(e&&e.message||'erreur inconnue'),'err');return}}
  try{downloadFile(data,'circuit-commutation.json');setStatus('Téléchargement du circuit démarré.','ok')}
  catch(e){setStatus('Échec du téléchargement : '+(e&&e.message||'erreur inconnue'),'err')}}
function readCircuit(o){
  if(!o||o.format!=='commutation'||!o.circuit||!Array.isArray(o.circuit.comps)||!Array.isArray(o.circuit.wires))return{err:'Ce fichier n’est pas un circuit Commutation.'};
  if(o.circuit.comps.length>2000||o.circuit.wires.length>5000)return{err:'Circuit trop grand.'};
  const num=v=>Number.isFinite(+v)&&v!==null&&v!=='',comps=[];
  for(const c of o.circuit.comps){
    if(!c||!(c.type in DEFAULTS||c.type==='gnd')||!num(c.x)||!num(c.y))return{err:'Fichier invalide : composant inconnu ou position manquante.'};
    const def=DEFAULTS[c.type]||{},p={};for(const k of Object.keys(def)){const v=c.p&&c.p[k];p[k]=typeof def[k]==='number'?(num(v)?+v:def[k]):(typeof v==='string'?v:def[k])}
    comps.push({id:Math.round(+c.id)||0,type:c.type,x:Math.round(+c.x),y:Math.round(+c.y),rot:((Math.round(+c.rot)||0)%4+4)%4,p,name:String(c.name||'').slice(0,24)})}
  const ids=new Set(comps.map(c=>c.id));if(ids.size!==comps.length||ids.has(0))return{err:'Fichier invalide : identifiants de composants en double.'};
  const wires=[];for(const w of o.circuit.wires){if(!w||![w.x1,w.y1,w.x2,w.y2].every(num))return{err:'Fichier invalide : fil mal défini.'};
    const q={x1:Math.round(+w.x1),y1:Math.round(+w.y1),x2:Math.round(+w.x2),y2:Math.round(+w.y2)};if(q.x1!==q.x2&&q.y1!==q.y2)return{err:'Fichier invalide : un fil n’est pas horizontal ou vertical.'};wires.push(q)}
  const pr=(Array.isArray(o.probes)?o.probes:[]).map((p,i)=>!p?null:p.kind==='m'?(MOPS[p.op]?{kind:'m',op:p.op,a:+p.a,b:+p.b,par:Number.isFinite(+p.par)?+p.par:0,show:p.show!==false,i}:null):(ids.has(p.comp)&&KIND[p.kind]&&p.kind!=='m'?{comp:p.comp,kind:p.kind,show:p.show!==false,i}:null)).filter(Boolean);
  const sc=Array.isArray(o.scopes)&&o.scopes.length?o.scopes.slice(0,6).map(q=>({sel:Array.isArray(q&&q.sel)?q.sel.filter(Number.isInteger):[],spec:!!(q&&q.spec),lanes:!q||q.lanes!==false,fmax:q&&typeof q.fmax==='string'?q.fmax.slice(0,12):'auto',win:q&&q.win==='hann'?'hann':'none',db:!!(q&&q.db)})):null;
  return{comps,wires,pr,sc,tstop:typeof o.tstop==='string'&&!isNaN(parseSI(o.tstop))?o.tstop:'5m',dt:typeof o.dt==='string'?o.dt:'auto'}}
function loadText(txt,name){let o;try{o=JSON.parse(txt)}catch(e){setStatus('Fichier illisible : ce n’est pas du JSON valide.','err');return}
  const r=readCircuit(o);if(r.err){setStatus(r.err,'err');return}
  snap();circuit={comps:r.comps,wires:r.wires};const idm=new Map();probes=r.pr.map(p=>{const id=pidc++;idm.set(p.i,id);return p.kind==='m'?{id,kind:'m',comp:0,op:p.op,a:p.a,b:p.b,par:p.par,show:p.show}:{id,comp:p.comp,kind:p.kind,show:p.show}});
  for(const p of probes)if(p.kind==='m'){p.a=idm.get(p.a)||0;p.b=MOPS[p.op].b?(idm.get(p.b)||0):0}
  prune();normalize();
  restoreScopes(r.sc?r.sc.map(q=>({...q,sel:q.sel.map(i=>idm.get(i)).filter(Boolean)})):[{sel:probes.filter(p=>p.show!==false).map(p=>p.id)}]);
  idc=Math.max(0,...circuit.comps.map(c=>c.id))+1;$('tstop').value=r.tstop;$('dtin').value=r.dt;sel=null;res=null;setTool('select');fit();persist();renderInsp();renderProbes();draw();drawScope();renderMeas();
  if(compile(circuit).error){setStatus((name||'Fichier')+' ouvert. '+compile(circuit).error,'err')}else simulate()}
function readFile(f){if(!f)return;if(f.size>5e6){setStatus('Fichier trop volumineux.','err');return}const fr=new FileReader();fr.onload=()=>loadText(String(fr.result),f.name);fr.onerror=()=>setStatus('Lecture du fichier impossible.','err');fr.readAsText(f)}
$('save').onclick=saveFile;$('open').onclick=()=>$('file').click();
$('file').onchange=e=>{readFile(e.target.files[0]);e.target.value=''};
const sbox=$('schbox');sbox.addEventListener('dragover',e=>e.preventDefault());sbox.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f)});

/* ---------- Exemples, démarrage ---------- */
function fit(){const{w,h}=sizeCanvas(cv);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y)=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)};
  for(const c of circuit.comps)for(const p of pinsOf(c))add(p[0],p[1]);for(const wr of circuit.wires){add(wr.x1,wr.y1);add(wr.x2,wr.y2)}
  if(x0>x1){view={ox:30,oy:30,s:1};return}const s=Math.max(.35,Math.min(1.15,Math.min((w-60)/((x1-x0+3)*G),(h-60)/((y1-y0+4)*G))));
  view.s=s;view.ox=(w-(x1-x0)*G*s)/2-x0*G*s;view.oy=(h-(y1-y0)*G*s)/2-y0*G*s}
function loadPreset(name){const p=PRESETS[name]();snap();circuit={comps:p.comps,wires:p.wires};idc=Math.max(...p.comps.map(c=>c.id))+1;
  probes=p.probes.map(q=>({id:pidc++,comp:q.comp,kind:q.kind,show:true}));restoreScopes([{sel:probes.map(q=>q.id)}]);sel=null;$('tstop').value=fmtSI(p.tstop);$('dtin').value='auto';res=null;setTool('select');fit();persist();renderInsp();renderProbes();draw();simulate()}
$('preset').onchange=e=>{if(e.target.value)loadPreset(e.target.value);e.target.value=''};
$('run').onclick=simulate;$('undo').onclick=undo;
$('clear').onclick=()=>{snap();circuit={comps:[],wires:[]};probes=[];restoreScopes([{}]);sel=null;res=null;view={ox:40,oy:40,s:1};persist();renderInsp();renderProbes();draw();drawScope();renderMeas();setStatus('Nouveau circuit. Posez des composants depuis la palette.')};
$('tstop').onchange=persist;$('dtin').onchange=persist;
window.addEventListener('resize',()=>{draw();drawScope()});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{buildPalette();setTool(tool);drawScope()});

/* ---------- Disposition redimensionnable ---------- */
let ui={};try{ui=JSON.parse(store.get('commutation-ui')||'{}')||{}}catch(e){ui={}}
const ctr=document.querySelector('.center'),work=document.querySelector('.work');
function applyUI(){ctr.classList.toggle('sbs',ui.layout==='side');ctr.style.setProperty('--a',Math.round((ui.a||.53)*1000)/10+'%');work.style.setProperty('--side',(ui.side||300)+'px');
  $('layout').textContent=ui.layout==='side'?'Empilé':'Côte à côte';$('gsplit').setAttribute('aria-orientation',ui.layout==='side'?'vertical':'horizontal')}
const saveUI=()=>store.set('commutation-ui',JSON.stringify(ui));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function splitTo(frac){ui.a=clamp(frac,.15,.85);applyUI()}
function sideTo(px){const w=work.getBoundingClientRect().width;ui.side=Math.round(clamp(px,200,Math.min(640,w*.55)));applyUI()}
function gutter(g,move,step,reset){
  g.addEventListener('pointerdown',e=>{e.preventDefault();g.setPointerCapture(e.pointerId);g.classList.add('act')});
  g.addEventListener('pointermove',e=>{if(g.hasPointerCapture(e.pointerId))move(e)});
  const end=()=>{g.classList.remove('act');saveUI()};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{reset();saveUI()});
  g.addEventListener('keydown',e=>{const d={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key];if(d){e.preventDefault();step(d);saveUI()}})}
gutter($('gsplit'),e=>{const r=ctr.getBoundingClientRect();splitTo(ui.layout==='side'?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height)},d=>splitTo((ui.a||.53)+d*.03),()=>{delete ui.a;applyUI()});
gutter($('gside'),e=>sideTo(work.getBoundingClientRect().right-e.clientX-3),d=>sideTo((ui.side||300)-d*24),()=>{delete ui.side;applyUI()});
$('layout').onclick=()=>{ui.layout=ui.layout==='side'?'stack':'side';applyUI();saveUI();requestAnimationFrame(()=>{fit();draw();drawScope()})};
if(window.ResizeObserver){let rf=0;const ro=new ResizeObserver(()=>{cancelAnimationFrame(rf);rf=requestAnimationFrame(()=>{draw();drawScope()})});ro.observe($('schbox'))}
applyUI();
function boot(){buildPalette();setTool('select');let ok=false;const raw=store.get('commutation-v1');
  if(raw){try{const o=JSON.parse(raw);if(o.circuit&&o.circuit.comps.length){circuit=o.circuit;normalize();probes=o.probes||[];idc=o.idc||100;pidc=o.pidc||100;restoreScopes(Array.isArray(o.scopes)&&o.scopes.length?o.scopes:[{sel:probes.filter(p=>p.show!==false).map(p=>p.id)}]);$('tstop').value=o.tstop||'5m';$('dtin').value=o.dt||'auto';ok=true}}catch(e){}}
  if(!ok)restoreScopes([{}]);if(ok){fit();renderInsp();renderProbes();draw();simulate()}else loadPreset('buck');undoStack=[]}
requestAnimationFrame(boot);
</script>
